server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 文件上传大小限制
    client_max_body_size 20M;

    # API 代理 - 代理到后端服务
    location /api/ {
        # 连接到后端网络的 web 服务，去掉 /api/ 前缀
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://u-linker-web:8000;  # 使用后端容器的服务名
        
        # 基本代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cookie 相关配置 - 确保 Cookie 正确传递
        proxy_set_header Cookie $http_cookie;
        proxy_cookie_path / /;
        
        # 文件上传超时配置（解决 VPN 导致的超时问题）
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        
        # 注意：由于前端和后端在同一域名下（通过 Nginx 代理），请求是同源的
        # 不需要在 Nginx 中设置 CORS 头，让后端 Flask-CORS 处理即可
        # 删除 CORS 头可以避免与 credentials 的冲突
    }

    # 上传文件代理（必须在 / 之前，优先级更高）
    location ^~ /uploads/ {
        proxy_pass http://u-linker-web:8000/uploads/;  # 使用后端容器的服务名
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 文件访问超时配置
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # 静态文件服务（头像等）- 代理到后端的 static 目录（必须在 / 之前）
    location ^~ /static/ {
        proxy_pass http://u-linker-web:8000/static/;  # 使用后端容器的服务名
        proxy_set_header Host $host;
        
        # 静态文件缓存
        expires 30d;
        add_header Cache-Control "public";
    }

    # Vue Router 历史模式支持
    # 所有路由都返回 index.html，让 Vue Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }
}


