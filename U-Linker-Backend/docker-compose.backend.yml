services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: u-linker-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"  # 仅本地访问
    networks:
      - u-linker-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask 应用服务
  web:
    build: .  # 使用当前目录的 Dockerfile
    container_name: u-linker-web
    restart: always
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    volumes:
      - ./uploads:/app/uploads
      - ./instance:/app/instance
      - ./static:/app/static  # 挂载 static 目录，确保头像文件持久化
    ports:
      - "127.0.0.1:8000:8000"  # 仅本地访问
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - u-linker-network

  # Nginx 反向代理（仅用于后端 API）
  nginx-backend:
    image: nginx:alpine
    container_name: u-linker-nginx-backend
    restart: always
    ports:
      - "8001:80"  # 后端 API 通过 8001 端口访问（可选，主要用于测试）
    volumes:
      - ./nginx.backend.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - web
    networks:
      - u-linker-network

volumes:
  mysql_data:
    driver: local

networks:
  u-linker-network:
    driver: bridge
    name: u-linker-network  # 指定网络名称，让前端可以连接

